schema_version: "1.0.0"
catalog_version: "2026-08-12"
source_manifest: vendor/creative-sources/manifest.json

policy:
  default_limit: 7
  minimum_recommended: 3
  maximum_limit: 7
  normal_statuses: [ACTIVE]
  opt_in_statuses: [ON_DEMAND]
  never_select_statuses: [REFERENCE_ONLY, BLOCKED]

techniques:
  - id: direction.sequence_meaning_first
    name: Sequence meaning before decoration
    description: Resolve the viewer question, dramatic turn, proof, and exit before choosing camera ornament.
    category: direction
    status: ACTIVE
    selectable: true
    priority: 100
    phases: [visual_plan, animatic]
    intents: [sequence_meaning, evidence_first, narrative_function]
    tags: [documentary, sequence, proof, story]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Motion Art Direction, license: PROJECT_LOCAL, path: .agents/skills/motion-art-direction/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Write the sequence question and exit condition before listing shots.
      - Reject a beautiful shot that does not add fact, feeling, or causality.

  - id: direction.shot_motivation
    name: Motivated shot design
    description: Give each shot one narrative function and let composition follow that function.
    category: direction
    status: ACTIVE
    selectable: true
    priority: 96
    phases: [visual_plan, animatic]
    intents: [shot_motivation, narrative_function, composition]
    tags: [shot_design, hierarchy, documentary]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Shot Composition, license: PROJECT_LOCAL, path: .agents/skills/shot-composition/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - State what the viewer learns or feels before naming lens, angle, or motion.
      - Keep one dominant visual idea per shot.

  - id: direction.opening_frame_intent
    name: Deliberate opening-frame intent
    description: Define the first readable image, its visible subjects, and any delayed reveal before describing motion.
    category: direction
    status: ACTIVE
    selectable: true
    priority: 97
    phases: [visual_plan, animatic, production]
    intents: [opening_frame, first_frame, delayed_reveal]
    tags: [composition, reveal, visual_anchor, shot_design]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Describe what is visible before the first movement begins.
      - Use an empty or partial opening only when the delayed reveal has a narrative purpose.

  - id: continuity.explicit_spatial_blocking
    name: Explicit spatial blocking
    description: Anchor every important subject in screen space and world space, including orientation, attention, and movement path.
    category: continuity
    status: ACTIVE
    selectable: true
    priority: 96
    phases: [visual_plan, animatic, production]
    intents: [spatial_blocking, subject_placement, action_continuity]
    tags: [blocking, geography, eye_line, screen_direction]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - State where each subject begins, faces, looks, and travels relative to a stable anchor.
      - Preserve the declared relationships across cuts unless the change itself is the story beat.

  - id: direction.behavioral_performance_beats
    name: Observable performance beats
    description: Direct emotion through objectives, obstacles, tactics, reactions, and visible behavior rather than labels alone.
    category: direction
    status: ACTIVE
    selectable: true
    priority: 94
    phases: [visual_plan, animatic, production]
    intents: [behavioral_performance, acting_direction, reaction]
    tags: [performance, subtext, objective, beat_change]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Convert internal emotion into gaze, breath, posture, interrupted action, or a change of tactic.
      - Give reactions and listening behavior their own timed beat when they carry meaning.

  - id: camera.observable_optical_result
    name: Observable optical result
    description: Specify how perspective, subject scale, background, and focus should look instead of relying on lens jargon alone.
    category: camera
    status: ACTIVE
    selectable: true
    priority: 95
    phases: [visual_plan, animatic, production]
    intents: [optical_result, lens_intent, perspective]
    tags: [optics, depth, compression, focus, subject_scale]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - State the intended perspective, background behavior, focus behavior, and subject scale in visible terms.
      - Treat focal length as an optional implementation hint, never as a substitute for the result.

  - id: direction.physical_causality
    name: Physical causality cues
    description: Make motion obey contact, weight, inertia, resistance, airflow, and material response so cause and effect remain legible.
    category: direction
    status: ACTIVE
    selectable: true
    priority: 93
    phases: [visual_plan, animatic, production]
    intents: [physical_causality, material_response, believable_motion]
    tags: [physics, weight, contact, inertia, environment]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Name the force, contact, and visible material response for every important movement.
      - Reject motion that changes position without a plausible initiating cause or settling behavior.

  - id: continuity.reference_role_binding
    name: Reference-role binding
    description: Assign each reference one explicit control role and state what it must preserve and what it must not transfer.
    category: continuity
    status: ACTIVE
    selectable: true
    priority: 92
    phases: [visual_plan, production]
    intents: [reference_role, multi_reference, identity_continuity]
    tags: [reference, identity, environment, object, style]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Provider-neutral cinematic direction design, license: PROJECT_LOCAL, path: docs/superpowers/specs/2026-08-12-cinematic-direction-principles-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Bind each file to one primary role such as subject, environment, object, composition, lighting, or style.
      - List both the attributes controlled by the reference and the attributes that must not leak from it.

  - id: continuity.process_geography
    name: Establish process geography
    description: Show the relationship among maker, tool, material, and workspace before fragmenting into details.
    category: continuity
    status: ACTIVE
    selectable: true
    priority: 98
    phases: [visual_plan, production, edit]
    intents: [process_geography, spatial_orientation, craft_process]
    tags: [wide_shot, geography, process, continuity]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Shot Composition, license: PROJECT_LOCAL, path: .agents/skills/shot-composition/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Use an establishing relationship shot before a run of macros.
      - Re-establish geography after a meaningful location or process-axis change.

  - id: continuity.screen_direction
    name: Preserve action and eye-line direction
    description: Maintain tool travel, gaze, material flow, and screen direction unless the cut deliberately disrupts them.
    category: continuity
    status: ACTIVE
    selectable: true
    priority: 91
    phases: [visual_plan, production, edit]
    intents: [screen_direction, action_continuity, eye_line]
    tags: [continuity, match_action, direction]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Shot Composition, license: PROJECT_LOCAL, path: .agents/skills/shot-composition/references/camera-and-grids.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Record the dominant vector for each process action.
      - Cross the axis only with an orienting shot or a deliberate disorientation beat.

  - id: camera.material_macro_parallax
    name: Material macro with restrained parallax
    description: Turn a still material detail into depth by separating foreground, subject plane, and background motion.
    category: camera
    status: ACTIVE
    selectable: true
    priority: 97
    phases: [visual_plan, animatic, production, compose]
    intents: [material_macro, photo_to_motion, tactile_detail]
    tags: [macro, parallax, still_image, texture, craft]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Motion Art Direction, license: PROJECT_LOCAL, path: .agents/skills/motion-art-direction/references/direction-playbook.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Move planes at different rates and keep the material fact readable.
      - Limit a macro to one tactile fact rather than decorative closeness.

  - id: camera.variable_velocity_push
    name: Variable-velocity camera push
    description: Accelerate through low-information space and decelerate into the factual or emotional focal point.
    category: camera
    status: ACTIVE
    selectable: true
    priority: 99
    phases: [visual_plan, animatic, production, compose]
    intents: [variable_camera_speed, photo_to_motion, camera_motion, attention_landing]
    tags: [speed_ramp, push_in, slow_fast_slow, easing]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: HyperFrames nudge curve, license: Apache-2.0, path: .agents/skills/hyperframes-animation/rules/nudge-curve.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Put the fastest motion between information beats, not across text that must be read.
      - Let the landing hold long enough for recognition.

  - id: camera.slow_observational_push
    name: Slow observational push
    description: Use a restrained push when the viewer needs time to inspect labor, texture, or evidence.
    category: camera
    status: ACTIVE
    selectable: true
    priority: 82
    phases: [visual_plan, animatic, production]
    intents: [observational_camera, contemplation, evidence_hold]
    tags: [slow_push, documentary, inspection]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Heritage Forge grammar, license: PROJECT_LOCAL, path: config/visual-grammars/HERITAGE_FORGE.yaml}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Start from a composed readable frame and move only enough to focus attention.
      - Do not repeat the same slow push across consecutive shots.

  - id: camera.static_evidence_hold
    name: Static evidence hold
    description: Stop camera motion when movement would compete with verification of a document, artifact, date, or measurement.
    category: camera
    status: ACTIVE
    selectable: true
    priority: 94
    phases: [visual_plan, animatic, edit]
    intents: [evidence_hold, exact_fact, document_reading]
    tags: [static, evidence, readability, proof]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Heritage Forge grammar, license: PROJECT_LOCAL, path: config/visual-grammars/HERITAGE_FORGE.yaml}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Hold the frame for the actual reading task, not for a generic cinematic pause.
      - Cut directly into evidence when narration makes a verifiable claim.

  - id: camera.rack_focus
    name: Two-plane rack focus
    description: Shift sharpness between authored depth planes to redirect attention without moving the whole frame.
    category: camera
    status: ON_DEMAND
    selectable: true
    priority: 70
    phases: [visual_plan, compose]
    intents: [rack_focus, depth_shift, attention_shift]
    tags: [blur, depth_of_field, focus]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES]
    source: {type: local_skill, label: HyperFrames depth-of-field rule, license: Apache-2.0, path: .agents/skills/hyperframes-animation/rules/depth-of-field-blur.md}
    activation: {default_allowed: false, requires_human_opt_in: true, requires_license_review: false, requires_network: false, note: Use only when the shot has authored depth planes.}
    directives:
      - Keep one plane genuinely sharp at all times.
      - Use one motivated focus transfer rather than continuous focus hunting.

  - id: transition.semantic_match_cut
    name: Semantic match cut
    description: Join shots through a shared shape, gesture, material state, light vector, or action meaning.
    category: transition
    status: ACTIVE
    selectable: true
    priority: 99
    phases: [visual_plan, animatic, edit, compose]
    intents: [semantic_transition, match_cut, visual_bridge]
    tags: [shape_match, gesture_match, material_match, meaning]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Beat Sync Editing, license: PROJECT_LOCAL, path: .agents/skills/beat-sync-editing/references/editing-techniques.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Name the shared visual or causal property before approving the cut.
      - Reject a morph that falsely implies factual continuity.

  - id: transition.velocity_matched
    name: Velocity-matched handoff
    description: Meet an accelerating exit with a decelerating entrance so two shots read as one continuous move.
    category: transition
    status: ACTIVE
    selectable: true
    priority: 90
    phases: [animatic, edit, compose]
    intents: [velocity_match, continuous_camera, whip_transition, camera_motion]
    tags: [speed_match, blur, directional_cut]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: HyperFrames beat direction, license: Apache-2.0, path: .agents/skills/hyperframes-creative/references/beat-direction.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Match exit and entry direction and approximate peak velocity.
      - Resolve blur immediately at the new focal point.

  - id: transition.sound_bridge
    name: Sound bridge across picture cuts
    description: Carry a process sound, ambience, or narration edge across a visual boundary to preserve continuity or anticipation.
    category: transition
    status: ACTIVE
    selectable: true
    priority: 88
    phases: [visual_plan, animatic, edit]
    intents: [sound_bridge, audio_continuity, anticipation]
    tags: [j_cut, l_cut, ambience, transition]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Sound Design, license: PROJECT_LOCAL, path: skills/creative/sound-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Start the next sound early to create anticipation or let the prior sound decay to preserve consequence.
      - Keep documentary source sound distinct from designed effects.

  - id: transition.causal_hard_cut
    name: Causal hard cut
    description: Cut without decoration when the next image is the direct consequence, proof, or contradiction of the current statement.
    category: transition
    status: ACTIVE
    selectable: true
    priority: 93
    phases: [visual_plan, animatic, edit]
    intents: [causal_cut, proof_cut, disruption]
    tags: [hard_cut, causality, evidence]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Beat Sync Editing, license: PROJECT_LOCAL, path: .agents/skills/beat-sync-editing/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Prefer the cut itself when the idea supplies enough force.
      - Use a hard cut to change register, reveal proof, or interrupt complacency.

  - id: transition.material_state_dissolve
    name: Material-state dissolve
    description: Use a restrained dissolve only for elapsed time, memory, or a visible material transformation.
    category: transition
    status: ACTIVE
    selectable: true
    priority: 77
    phases: [visual_plan, animatic, edit]
    intents: [material_transformation, elapsed_time, memory]
    tags: [dissolve, patina, heat, time]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Heritage Forge grammar, license: PROJECT_LOCAL, path: config/visual-grammars/HERITAGE_FORGE.yaml}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Align the material feature that survives the dissolve.
      - Do not use long dissolves as a universal polish layer.

  - id: editing.radio_paper_cut
    name: Story-first radio and paper edit
    description: Lock the argument and emotional order with narration and evidence before filling coverage gaps with B-roll.
    category: editing
    status: ACTIVE
    selectable: true
    priority: 100
    phases: [script, visual_plan, animatic, edit]
    intents: [radio_edit, paper_edit, story_structure]
    tags: [documentary, a_roll, story_lock]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Long-form editing, license: PROJECT_LOCAL, path: skills/creative/long-form.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Build the story without decorative coverage first.
      - Treat missing visual proof as a story hole, not an excuse for generic B-roll.

  - id: editing.tension_release_pacing
    name: Tension and release pacing
    description: Alternate compression, acceleration, stillness, and payoff instead of maintaining one smooth tempo.
    category: editing
    status: ACTIVE
    selectable: true
    priority: 92
    phases: [visual_plan, animatic, edit]
    intents: [tension_release, pacing_arc, rhythm]
    tags: [pace, hold, acceleration, payoff]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Motion Art Direction, license: PROJECT_LOCAL, path: .agents/skills/motion-art-direction/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Name the sequence rhythm before assigning shot durations.
      - Use stillness after intense motion as a deliberate release.

  - id: editing.rhythmic_variation
    name: Non-uniform edit rhythm
    description: Mix hard cuts, short transitions, held frames, and varied easing so the edit does not feel uniformly synthetic.
    category: editing
    status: ACTIVE
    selectable: true
    priority: 89
    phases: [animatic, edit, compose]
    intents: [rhythmic_variation, avoid_ai_smoothness, beat_sync]
    tags: [rhythm, hard_cut, hold, varied_easing]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: local_skill, label: Beat Sync Editing, license: PROJECT_LOCAL, path: .agents/skills/beat-sync-editing/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Let content and sound accents determine cut density.
      - Avoid applying one transition preset to every boundary.

  - id: typography.exact_fact_overlay
    name: Evidence-bound exact typography
    description: Render exact dates, names, quotations, and quantities in authored graphics bound to verified claims.
    category: typography
    status: ACTIVE
    selectable: true
    priority: 100
    phases: [visual_plan, animatic, compose, qc]
    intents: [exact_fact, evidence_overlay, readable_typography]
    tags: [date, statistic, quotation, claim_id]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Kinetic Typography, license: PROJECT_LOCAL, path: .agents/skills/kinetic-typography/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Copy the verified literal exactly and record its claim ID.
      - Hold the resolved factual state long enough to read and verify.

  - id: typography.kinetic_emphasis
    name: Kinetic emphasis with semantic restraint
    description: Animate only the words whose timing or physical behavior clarifies meaning.
    category: typography
    status: ACTIVE
    selectable: true
    priority: 79
    phases: [visual_plan, animatic, compose]
    intents: [kinetic_typography, word_emphasis, title_motion]
    tags: [type, emphasis, timing, hierarchy]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Kinetic Typography, license: PROJECT_LOCAL, path: .agents/skills/kinetic-typography/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Choose a motion verb for the emphasized word.
      - Resolve to a stable readable state rather than constant motion.

  - id: graphics.progressive_diagram_reveal
    name: Progressive mechanism reveal
    description: Reveal a process diagram in the same order that narration explains parts and relationships.
    category: graphics
    status: ACTIVE
    selectable: true
    priority: 90
    phases: [visual_plan, animatic, compose]
    intents: [mechanism_explainer, progressive_reveal, process_diagram]
    tags: [diagram, connector, sequence, causality]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Diagram Animation, license: PROJECT_LOCAL, path: .agents/skills/diagram-animation/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Add each label only when its object or relationship becomes relevant.
      - Freeze the completed diagram before leaving the scene.

  - id: graphics.map_spatial_context
    name: Map as spatial argument
    description: Use a map to establish distance, movement, distribution, or geographic stakes rather than as decoration.
    category: graphics
    status: ACTIVE
    selectable: true
    priority: 83
    phases: [visual_plan, animatic, compose]
    intents: [map_context, geographic_stakes, route_animation]
    tags: [map, location, distance, route]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Map Animation, license: PROJECT_LOCAL, path: .agents/skills/map-animation/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - State the geographic question the map answers.
      - Keep labels exact and source-bound.

  - id: graphics.data_relationship_motion
    name: Animate data relationships
    description: Move position, scale, and connection to explain a relationship instead of decorating a number.
    category: graphics
    status: ACTIVE
    selectable: true
    priority: 86
    phases: [visual_plan, animatic, compose]
    intents: [data_relationship, comparison, statistic_motion]
    tags: [chart, data, comparison, exact_fact]
    provider_scopes: [GENERIC]
    render_runtimes: [HYPERFRAMES, REMOTION]
    source: {type: local_skill, label: Color Motion, license: PROJECT_LOCAL, path: .agents/skills/color-motion/SKILL.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Keep no more than two information layers active at once.
      - Make the final quantitative relationship inspectable in a stable hold.

  - id: sound.j_l_cut
    name: J-cut and L-cut narration flow
    description: Offset picture and sound boundaries to create anticipation or preserve emotional consequence.
    category: sound
    status: ACTIVE
    selectable: true
    priority: 87
    phases: [animatic, edit]
    intents: [j_cut, l_cut, narration_flow]
    tags: [audio_edit, transition, anticipation]
    provider_scopes: [GENERIC]
    render_runtimes: [ANY]
    source: {type: project_doc, label: Sound Design, license: PROJECT_LOCAL, path: skills/creative/sound-design.md}
    activation: {default_allowed: true, requires_human_opt_in: false, requires_license_review: false, requires_network: false}
    directives:
      - Use early sound to pose the next question and late sound to preserve the prior consequence.
      - Do not let the music bed erase meaningful production sound.

  - id: sound.material_motif
    name: Material sound motif
