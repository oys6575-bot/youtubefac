schema_version: "1.0.0"

control_plane:
  source_of_truth: openmontage
  coordinator_role: control
  pilot_stop_gate: proposal

auto_dispatch:
  enabled: true
  trigger_action: approve_topic
  stages: [research, media_collection, media_relevance_review, evidence_lock, proposal]
  max_retries: 1
  stop_gate: proposal

orchestrator:
  name: orca
  base_ref: agent/youtube-factory-runtime
  reuse_existing_runs: false
  reuse_existing_worktrees: false

workspace:
  repo_root_kind: parent_git_repository
  factory_cwd_suffix: 유튜브공장
  canonical_projects_env: OPENMONTAGE_PROJECTS_DIR
  canonical_projects_root: 유튜브공장/projects

handoff:
  required_fields: [source_commit, artifact_path, artifact_sha256]
  verification_required_fields:
    - verdict
    - source_commit
    - input_sha256
    - verified_at
    - source_urls
  merge_requires_exact_match: true

roles:
  control:
    runtime: codex
    model: gpt-5.6-sol
    effort: xhigh
    profile: null
    resource_lane: cloud
    writes: [coordination_records, integration_commits]
  research:
    runtime: hermes
    model: qwen3.6-35b-a3b-mlx
    effort: null
    profile: ytf-research
    resource_lane: local_text
    writes: [research/topic-candidates]
  verification:
    runtime: codex
    model: gpt-5.6-sol
    effort: high
    profile: null
    resource_lane: cloud
    writes: [reviews]
  story_visual:
    runtime: claude
    model: claude-opus-5
    effort: max
    profile: null
    resource_lane: cloud
    writes: [scripts, visual-plans, animatics]
  production:
    runtime: hermes
    model: qwen3.6-35b-a3b-mlx
    effort: null
    profile: ytf-production
    resource_lane: local_text
    writes: [production-packets, asset-ledgers]
  qa:
    runtime: codex
    model: gpt-5.6-sol
    effort: high
    profile: null
    resource_lane: cloud
    writes: [reviews]

local_models:
  endpoint: http://127.0.0.1:1234/v1
  primary: qwen3.6-35b-a3b-mlx
  second_opinion: gemma-4-31b-it-mlx
  silent_switch: false

resource_lanes:
  cloud:
    parallel_allowed: true
  local_text:
    max_concurrent: 1
  local_media:
    max_concurrent: 1
  manual:
    max_concurrent: 1
  mutex:
    - [local_text, local_media]

provider_policy:
  silent_fallback: false
  silent_model_switch: false
  paid_calls_require_gate: budget_approval

topview:
  mode: manual_semi_automatic
  api_enabled: false
  automatic_dispatch: false
  result_ingest_requires_manifest: true

human_gates:
  topic_approval: {authority: user, automatic_approval: false}
  animatic_approval: {authority: user, automatic_approval: false}
  budget_approval: {authority: user, automatic_approval: false}
  asset_selection: {authority: user, automatic_approval: false}
  final_edit_approval: {authority: user, automatic_approval: false}
  publish_approval: {authority: user, automatic_approval: false}

secrets:
  default_deny: true
  role_allowlists:
    control: []
    research: [YOUTUBE_API_KEY]
    verification: []
    story_visual: []
    production: [PEXELS_API_KEY, PIXABAY_API_KEY, UNSPLASH_ACCESS_KEY]
    qa: []

global_prohibitions:
  - fabricate_human_approval
  - automatic_publish
  - unapproved_paid_call
  - silent_provider_switch
  - overwrite_verified_evidence
